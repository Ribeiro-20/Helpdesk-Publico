# Long-running administrative company refresh.
# Keep this exact location ahead of the general application proxy.
location = /api/admin/extract-companies {
    proxy_pass http://localhost:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The Next route allows 300 seconds. Nginx must outlive it so a
    # successful refresh is not reported to the administrator as HTTP 504.
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
}
