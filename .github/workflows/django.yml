name: Django CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  pyrefly:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Type check (pyrefly)
        working-directory: helpdeskMain
        run: pyrefly check .

  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        working-directory: helpdeskMain
        run: pytest -q

  pylint:
      runs-on: ubuntu-latest

      strategy:
        matrix:
          python-version: [3.11]

      steps:
        - uses: actions/checkout@v6

        - uses: actions/setup-python@v6
          with:
            python-version: ${{ matrix.python-version }}
            cache: "pip"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Lint with pylint
          working-directory: helpdeskMain
          run: pylint . || true