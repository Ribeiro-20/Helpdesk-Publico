name: Django CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    env:
      H_APIKEY: ${{ secrets.HAPI_KEY }}
      HENDPOINT: ${{ vars.HENDPOINT }}
      EAPI_KEY: ${{ secrets.EAPI_KEY }}
      EENDPOINT: ${{ vars.EENDPOINT }}
      TENDPOINT: ${{ secrets.TENDPOINT }}
      TENDPOINT_OAUTH: ${{ secrets.TENDPOINT_OAUTH }}
      TCLIENTID: ${{ secrets.TCLIENTID }}
      TCLIENT_SECRET: ${{ secrets.TCLIENT_SECRET }}
      TREDIRECT_OAUTH: ${{ secrets.TREDIRECT_OAUTH }}

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Type check (pyrefly)
        working-directory: helpdeskMain
        env:
          PYTHONPATH: .
        run: pyrefly check .

  pytest:
    runs-on: ubuntu-latest
    env:
      H_APIKEY: ${{ secrets.HAPI_KEY }}
      HENDPOINT: ${{ vars.HENDPOINT }}
      EAPI_KEY: ${{ secrets.EAPI_KEY }}
      EENDPOINT: ${{ vars.EENDPOINT }}
      TENDPOINT: ${{ secrets.TENDPOINT }}
      TENDPOINT_OAUTH: ${{ secrets.TENDPOINT_OAUTH }}
      TCLIENTID: ${{ secrets.TCLIENTID }}
      TCLIENT_SECRET: ${{ secrets.TCLIENT_SECRET }}
      TREDIRECT_OAUTH: ${{ secrets.TREDIRECT_OAUTH }}

    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests
        working-directory: helpdeskMain
        env:
          PYTHONPATH: .
        run: pytest -q

  pylint:
      runs-on: ubuntu-latest
      env:
        H_APIKEY: ${{ secrets.HAPI_KEY }}
        HENDPOINT: ${{ vars.HENDPOINT }}
        EAPI_KEY: ${{ secrets.EAPI_KEY }}
        EENDPOINT: ${{ vars.EENDPOINT }}
        TENDPOINT: ${{ secrets.TENDPOINT }}
        TENDPOINT_OAUTH: ${{ secrets.TENDPOINT_OAUTH }}
        TCLIENTID: ${{ secrets.TCLIENTID }}
        TCLIENT_SECRET: ${{ secrets.TCLIENT_SECRET }}
        TREDIRECT_OAUTH: ${{ secrets.TREDIRECT_OAUTH }}

      strategy:
        matrix:
          python-version: [3.11]

      steps:
        - uses: actions/checkout@v6

        - uses: actions/setup-python@v6
          with:
            python-version: ${{ matrix.python-version }}
            cache: "pip"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Lint with pylint
          working-directory: helpdeskMain
          env:
            PYTHONPATH: .
          run: pylint . || true