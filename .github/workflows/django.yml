name: Django CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.13]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pyrefly pytest

      - name: Lint (pylint)
        working-directory: helpdeskMain
        run: pylint .

      - name: Type check (pyrefly)
        working-directory: helpdeskMain
        run: pyrefly check .

      - name: Tests
        working-directory: helpdeskMain
        run: pytest -q
