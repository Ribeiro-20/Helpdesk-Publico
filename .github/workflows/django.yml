name: Django CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint

      - name: Run pylint
        working-directory: helpdeskMain
        run: |
          pylint . || true

  pyrefly:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyrefly

      - name: Set Django environment
        run: echo "DJANGO_SETTINGS_MODULE=helpdesk.settings" >> $GITHUB_ENV

      - name: Run pyrefly
        working-directory: helpdeskMain
        run: pyrefly check .

  test:
    runs-on: ubuntu-latest
    needs: [lint, pyrefly]

    strategy:
      fail-fast: false
      matrix:
        python-version: [3.13]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set Django environment
        run: echo "DJANGO_SETTINGS_MODULE=helpdesk.settings" >> $GITHUB_ENV

      - name: Run tests
        working-directory: helpdeskMain
        run: pytest -q
